[project]
name = "arc_search"
version = "0.1.0"
description = "Self-hosted face search engine over a targeted vertical crawl"
requires-python = ">=3.11"

# NOTE ON PINNING
# Lower bounds live here; exact versions live in the committed lockfile.
# Generate it before the first real run and commit it:
#     uv lock                  (preferred)
#     pip-compile pyproject.toml -o requirements.lock
# eye_of_web shipped every dependency as `>=` with no lock. A fresh install
# resolved differently than the author's machine, and nothing caught it.
dependencies = [
    # crawl
    "httpx[http2]>=0.27",
    "selectolax>=0.3.21",        # fast HTML parsing; lxml-free
    "protego>=0.3",              # robots.txt, the parser Scrapy uses
    "tenacity>=8.2",             # retry/backoff
    "pyyaml>=6.0",

    # image + face
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.9",
    "pillow>=10.2",
    "insightface>=0.7.3",
    "onnxruntime-gpu>=1.17",     # CPU-only install is a ~20x throughput loss
    "pdqhash>=0.2.4",            # Meta's 256-bit perceptual hash (ThreatExchange)

    # storage
    "qdrant-client>=1.9",
    "psycopg[binary,pool]>=3.1",

    # serve
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",

    # ops
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.3",
    "mypy>=1.9",
    "respx>=0.21",               # httpx mocking, for crawler tests
]
eval = [
    "scikit-learn>=1.4",         # ROC / threshold derivation only
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arc_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "src" so `pytest` works without an editable install. "tests" so helper
# modules resolve under a BARE `pytest` as well as `python -m pytest` -- the
# latter silently prepends the CWD, which hid a broken import until CI (which
# runs bare) caught it. Run bare pytest locally to match CI.
pythonpath = ["src", "tests"]
addopts = "-q --strict-markers"
asyncio_mode = "strict"                       # async tests must be marked, explicitly
asyncio_default_fixture_loop_scope = "function"
markers = [
    "gpu: requires a CUDA device and the InsightFace model pack",
    "integration: requires docker compose services running",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
packages = ["arc_search"]
ignore_missing_imports = true
