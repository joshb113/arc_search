[project]
name = "arc_search"
version = "0.1.0"
description = "Self-hosted face search engine over a targeted vertical crawl"
requires-python = ">=3.11"

# NOTE ON PINNING
# Lower bounds live here; exact versions live in the committed uv.lock (94
# packages). Regenerate with `uv lock` after changing anything below; CI runs
# `uv lock --check` and fails if the two disagree.
#
# eye_of_web shipped every dependency as `>=` with no lock. A fresh install
# resolved differently than the author's machine, and nothing caught it. This
# is not theoretical here either: `opencv-python-headless>=4.9` currently
# resolves to 5.0.0.93 -- a major version the code has never been run against.
# The lock is what makes that a deliberate upgrade instead of a surprise.
dependencies = [
    # crawl
    "httpx[http2]>=0.27",
    "selectolax>=0.3.21",        # fast HTML parsing; lxml-free
    "protego>=0.3",              # robots.txt, the parser Scrapy uses
    "tenacity>=8.2",             # retry/backoff
    "pyyaml>=6.0",

    # image + face
    "numpy>=1.26,<3",
    # NOT opencv-python. Both provide `cv2` and installing both shadows one
    # arbitrarily. insightface DEPENDS on the non-headless build, so a plain
    # `pip install -e .` pulls it in anyway -- install insightface with
    # --no-deps, or accept that the full build wins. Measured working combo on
    # this machine is recorded in vault/00_Brain/CLAUDE.md.
    "opencv-python-headless>=4.9",
    "pillow>=10.2",
    # 1.0.1 (2026-05) is the first release shipped as a pure-python
    # `py3-none-any` wheel. 0.7.3 was sdist-only and needed a C toolchain, which
    # is why it never installed cleanly here; it also has no Python 3.14 wheel
    # for its build deps. Do not float this floor back down.
    "insightface>=1.0.1",
    # The [cuda,cudnn] extras are NOT optional in practice -- they pull the CUDA
    # runtime as wheels. Without them onnxruntime finds no cublasLt, prints one
    # line to stderr, and SILENTLY runs every model on CPU. Measured on an
    # RTX 5070: 49.0 img/s with CUDA vs 4.1 img/s without, i.e. ~12x, which at
    # the 30M-image scale target is ~7 days against ~85 days.
    # index/faces.py:register_cuda_runtime() puts those wheels on the Windows
    # DLL search path, and effective_providers() reports what actually loaded.
    "onnxruntime-gpu[cuda,cudnn]>=1.29",
    "pdqhash>=0.2.4",            # Meta's 256-bit perceptual hash (ThreatExchange)

    # storage
    # Keep this minor in step with the qdrant image in docker-compose.yml. A
    # `>=1.9` floor let the client reach 1.19 against a pinned 1.9.2 server,
    # which left no working search path in either direction -- see the version
    # note in src/arc_search/index/vectors.py.
    "qdrant-client>=1.19,<1.20",
    "psycopg[binary,pool]>=3.1",

    # serve
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",

    # ops
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.3",
    "mypy>=1.9",
    "respx>=0.21",               # httpx mocking, for crawler tests
]
eval = [
    "scikit-learn>=1.4",         # ROC / threshold derivation only
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arc_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "src" so `pytest` works without an editable install. "tests" so helper
# modules resolve under a BARE `pytest` as well as `python -m pytest` -- the
# latter silently prepends the CWD, which hid a broken import until CI (which
# runs bare) caught it. Run bare pytest locally to match CI.
pythonpath = ["src", "tests"]
addopts = "-q --strict-markers -m 'not gpu'"
# gpu tests load DINOv2 + SigLIP2 (~1.5 GB, ~30 s) and need a CUDA device, so
# they are OUT of the default run -- the CI gpu job opts back in with its own
# -m, which overrides this one. Run them locally with: pytest -m gpu
asyncio_mode = "strict"                       # async tests must be marked, explicitly
asyncio_default_fixture_loop_scope = "function"
markers = [
    "gpu: requires a CUDA device and the InsightFace model pack",
    "integration: requires docker compose services running",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# B008 forbids function calls in argument defaults, which is exactly how FastAPI
# declares request parameters -- `photo: UploadFile = File(...)`. These are
# declarations, not the mutable-default footgun the rule exists to catch, so the
# alternative would be a noqa on every route signature in serve/.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.mypy]
python_version = "3.11"
packages = ["arc_search"]
ignore_missing_imports = true
