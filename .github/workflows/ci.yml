# CI from commit 1.
#
# eye_of_web had 34k LOC, zero tests, and zero CI. That is the single reason it
# was unforkable: it shipped an inverted similarity comparison and two silently
# dead search paths, and nothing could have caught either.
#
# The fast job below installs no GPU stack, no opencv, and no onnxruntime. It
# covers the pure logic -- URL normalization, frontier persistence, extraction,
# BK-tree, dedup ordering, crawl scope -- plus the whole crawl loop, which runs
# against respx rather than the network. It must stay under a minute.
#
# httpx/protego are here because the crawl loop is tested, not because anything
# reaches the network: respx intercepts at the transport layer. Likewise
# psycopg: tests/test_store.py imports the module for its pure helpers, and the
# tests that need an actual server are marked `integration` and skipped unless
# ARC_TEST_PG_DSN is set. pillow is used to generate real image fixtures and to
# read image headers in the fetch path.
#
# pdqhash matters more than it looks. Without it, index/dedup.py falls back to a
# 64-bit dHash -- so CI was exercising a hash the shipped code never uses, under
# a near_dup_threshold of 31 that is calibrated for PDQ's 256 bits and is
# meaningless against 64. The BK-tree tests passed either way because they are
# structural, which is exactly why the divergence went unnoticed.
#
# qdrant-client is here for the same reason as psycopg: tests/test_vectors.py
# imports index/vectors.py for its pure validation tests, and a missing client
# would be a COLLECTION error rather than a skip -- the whole file would vanish
# from the run and the suite would still report green. The tests that need a
# live server are marked `integration` and skip themselves when 6333 is closed.
# Its version floor is pinned in step with the qdrant image in
# docker-compose.yml; see the note in src/arc_search/index/vectors.py.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pure-logic deps only
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio respx ruff \
                      numpy selectolax structlog pillow pdqhash \
                      httpx protego pyyaml pydantic-settings \
                      "psycopg[binary]" "qdrant-client>=1.19,<1.20"

      # Cheap (no downloads) and catches the failure mode the eye_of_web audit
      # names directly: a dependency added to pyproject but never locked, so a
      # fresh install resolves differently from the author's machine. Installing
      # FROM the lock here would drag in onnxruntime-gpu and blow the one-minute
      # budget; verifying it is current costs milliseconds.
      - name: Lockfile is current
        run: |
          pip install uv
          uv lock --check

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Test
        run: pytest tests -q --cov=arc_search --cov-report=term-missing

  # Runs only on demand: needs the InsightFace model pack and a CUDA device,
  # neither of which exists on a GitHub runner. Wire this to a self-hosted
  # runner once there is a GPU box to point it at.
  gpu:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - name: Install full stack
        run: pip install -e ".[dev]"
      - name: GPU + integration tests
        run: pytest tests -q -m "gpu or integration"
